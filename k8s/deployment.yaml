apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
  namespace: aegis
  labels:
    app: aegis
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: aegis
  template:
    metadata:
      labels:
        app: aegis
    spec:
      containers:
      - name: aegis
        image: linaalbluwi/aegis-api-shield:latest
        command: ["uvicorn"]
        args: ["aegis.main:app", "--host", "0.0.0.0", "--port", "8443"]
        ports:
        - containerPort: 8443
          protocol: TCP
        envFrom:
        - configMapRef:
            name: aegis-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
