replicaCount: 3

image:
  repository: linaalbluwi/aegis-api-shield
  tag: latest
  pullPolicy: Always

config:
  maxRequests: 100
  windowSeconds: 60
  blockDuration: 120
  enableSqli: true
  enableXss: true
  enableCommandInjection: true
  enablePathTraversal: true
  enableJwt: true
  enableDataLeak: true
  enableRateLimit: true

service:
  type: LoadBalancer
  port: 443

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
